# Android release build, download-size budget and cold-start measurement (roadmap commitment C4).
# Builds without EAS: `expo prebuild` generates the native project (never committed), Gradle builds it.
# The APK is signed with the debug key — fine for measuring; Play Store signing comes with the release sprint.
name: Android release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'mobile/**'
      - 'packages/core/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/core/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: release APK + size budget
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK for phones (arm64)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Keep the phone APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/simuwork-arm64.apk
      - name: Download-size budget (< 25 MB)
        run: node scripts/apk-size.mjs apk/simuwork-arm64.apk
      - name: Build release APK for the CI emulator (x86_64)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk apk/simuwork-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: simuwork-android
          path: mobile/apk/
          retention-days: 14

  cold-start:
    name: cold start (emulator)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simuwork-android
          path: apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_4a
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node mobile/scripts/cold-start.mjs apk/simuwork-x86_64.apk
