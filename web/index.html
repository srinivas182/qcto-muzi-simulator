<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Interactive workplace simulators and AI courses for QCTO occupational programmes." />
    <meta name="theme-color" content="#0D1230" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SimuWork</title>
    <script>
      /* Apply dark mode before first paint (no flash). */
      try {
        var m = localStorage.getItem('sw-theme');
        if (m === 'dark' || (!m && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
